[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb_price"
version = "0.0.1"
description = "Projeto de ci\u00eancia de dados para an\u00e1lise e previs\u00e3o de pre\u00e7os de im\u00f3veis do Airbnb."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.11,<3.14"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "dataset", "features", "plots"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["modeling*"]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["config", "dataset", "features", "plots", "modeling"]
force-sort-within-sections = true

